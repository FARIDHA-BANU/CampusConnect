
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Events | CampusConnect</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="navbar">
        <a href="index.html" class="brand"><span class="brand-icon">✦</span> CampusConnect</a>
        <button class="menu-toggle" id="menuToggle" aria-label="Toggle navigation">☰</button>
        <nav class="nav-links" id="navLinks">
            <a href="index.html">Home</a><a href="events.html">Explore Events</a>
            <a href="registrations.html">My Registrations</a><a href="admin.html">Admin</a>
        </nav>
        <a href="registration.html" class="btn btn-primary nav-cta">Register ↗</a>
    </header>

    <main class="section content-section">
        <div class="section-heading">
            <div><span class="eyebrow">WHAT'S HAPPENING</span><h2>Explore Campus Events</h2><p>Find the perfect event for your interests.</p></div>
            <span class="result-count" id="resultCount">0 events</span>
        </div>

        <div class="event-toolbar">
            <div class="search-box"><span>⌕</span><input type="search" id="eventSearch" placeholder="Search events..." aria-label="Search events"></div>
            <select id="categoryFilter" aria-label="Filter category">
                <option value="All">All Categories</option><option>Technical</option>
                <option>Cultural</option><option>Sports</option><option>Workshop</option>
            </select>
            <select id="sortEvents" aria-label="Sort events">
                <option value="date">Sort by date</option><option value="name">Sort by name</option>
            </select>
        </div>

        <div class="category-chips" id="categoryChips">
            <button class="chip active" data-category="All">All Events</button>
            <button class="chip" data-category="Technical">💻 Technical</button>
            <button class="chip" data-category="Cultural">🎭 Cultural</button>
            <button class="chip" data-category="Sports">⚽ Sports</button>
            <button class="chip" data-category="Workshop">🛠 Workshops</button>
        </div>

        <div class="event-grid" id="eventGrid"></div>
        <p class="empty-state hidden" id="emptyEvents">No events found. Try another search or category.</p>
    </main>

    <footer class="footer">
        <a href="index.html" class="brand footer-brand">✦ CampusConnect</a>
        <p>Discover. Register. Participate.</p>
        <p class="copyright">© <span id="currentYear"></span> CampusConnect</p>
    </footer>
    <div id="toast" class="toast" role="status"></div>

    <script src="js/events.js"></script>
    <script src="js/registration.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
